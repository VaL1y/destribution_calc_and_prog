name: warehouse-tier4-local

services:
  etcd-3:
    image: gcr.io/etcd-development/etcd:v3.6.14
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:${ETCD3_CLIENT_PORT:-2379}
      - --advertise-client-urls=http://${LOCAL_HOST}:${ETCD3_CLIENT_PORT:-2379}
      - --listen-peer-urls=http://0.0.0.0:${ETCD3_PEER_PORT:-2380}
      - --initial-advertise-peer-urls=http://${LOCAL_HOST}:${ETCD3_PEER_PORT:-2380}
      - --initial-cluster=etcd-1=http://${REMOTE_HOST}:${ETCD1_PEER_PORT:-2380},etcd-2=http://${REMOTE_HOST}:${ETCD2_PEER_PORT:-2382},etcd-3=http://${LOCAL_HOST}:${ETCD3_PEER_PORT:-2380}
      - --initial-cluster-token=${ETCD_CLUSTER_TOKEN:-warehouse-tier4-etcd}
      - --initial-cluster-state=new
    ports:
      - "${ETCD3_CLIENT_PORT:-2379}:${ETCD3_CLIENT_PORT:-2379}"
      - "${ETCD3_PEER_PORT:-2380}:${ETCD3_PEER_PORT:-2380}"
    volumes:
      - etcd3_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 30

  pg-3:
    build:
      context: ..
      dockerfile: tier_4/patroni/Dockerfile
    restart: unless-stopped
    environment:
      PATRONI_SCOPE: ${CLUSTER_NAME:-warehouse-tier4}
      PATRONI_NAME: pg-3
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/patroni
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: ${LOCAL_HOST}:${PG3_PORT:-5432}
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: ${LOCAL_HOST}:${PATRONI3_REST_PORT:-8008}
      PATRONI_ETCD3_HOSTS: "${REMOTE_HOST}:${ETCD1_CLIENT_PORT:-2379},${REMOTE_HOST}:${ETCD2_CLIENT_PORT:-2381},${LOCAL_HOST}:${ETCD3_CLIENT_PORT:-2379}"
      PATRONI_SUPERUSER_USERNAME: ${POSTGRES_SUPERUSER:-postgres}
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_USERNAME: ${POSTGRES_REPLICATION_USER:-replicator}
      PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PG3_PORT:-5432}:5432"
      - "${PATRONI3_REST_PORT:-8008}:8008"
    volumes:
      - pg3_data:/var/lib/postgresql/patroni
    depends_on:
      etcd-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  etcd3_data:
  pg3_data:
