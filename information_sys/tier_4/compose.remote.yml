name: warehouse-tier4-remote

x-patroni-environment: &patroni-environment
  PATRONI_SCOPE: ${CLUSTER_NAME:-warehouse-tier4}
  PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/patroni
  PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
  PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
  PATRONI_ETCD3_HOSTS: "${REMOTE_HOST}:${ETCD1_CLIENT_PORT:-2379},${REMOTE_HOST}:${ETCD2_CLIENT_PORT:-2381},${LOCAL_HOST}:${ETCD3_CLIENT_PORT:-2379}"
  PATRONI_SUPERUSER_USERNAME: ${POSTGRES_SUPERUSER:-postgres}
  PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
  PATRONI_REPLICATION_USERNAME: ${POSTGRES_REPLICATION_USER:-replicator}
  PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-warehouse}
  POSTGRES_USER: ${POSTGRES_USER:-warehouse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-patroni-service: &patroni-service
  build:
    context: ..
    dockerfile: tier_4/patroni/Dockerfile
  restart: unless-stopped
  environment: *patroni-environment
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  etcd-1:
    image: gcr.io/etcd-development/etcd:v3.6.14
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:${ETCD1_CLIENT_PORT:-2379}
      - --advertise-client-urls=http://${REMOTE_HOST}:${ETCD1_CLIENT_PORT:-2379}
      - --listen-peer-urls=http://0.0.0.0:${ETCD1_PEER_PORT:-2380}
      - --initial-advertise-peer-urls=http://${REMOTE_HOST}:${ETCD1_PEER_PORT:-2380}
      - --initial-cluster=etcd-1=http://${REMOTE_HOST}:${ETCD1_PEER_PORT:-2380},etcd-2=http://${REMOTE_HOST}:${ETCD2_PEER_PORT:-2382},etcd-3=http://${LOCAL_HOST}:${ETCD3_PEER_PORT:-2380}
      - --initial-cluster-token=${ETCD_CLUSTER_TOKEN:-warehouse-tier4-etcd}
      - --initial-cluster-state=new
    ports:
      - "${ETCD1_CLIENT_PORT:-2379}:${ETCD1_CLIENT_PORT:-2379}"
      - "${ETCD1_PEER_PORT:-2380}:${ETCD1_PEER_PORT:-2380}"
    volumes:
      - etcd1_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 30

  etcd-2:
    image: gcr.io/etcd-development/etcd:v3.6.14
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:${ETCD2_CLIENT_PORT:-2381}
      - --advertise-client-urls=http://${REMOTE_HOST}:${ETCD2_CLIENT_PORT:-2381}
      - --listen-peer-urls=http://0.0.0.0:${ETCD2_PEER_PORT:-2382}
      - --initial-advertise-peer-urls=http://${REMOTE_HOST}:${ETCD2_PEER_PORT:-2382}
      - --initial-cluster=etcd-1=http://${REMOTE_HOST}:${ETCD1_PEER_PORT:-2380},etcd-2=http://${REMOTE_HOST}:${ETCD2_PEER_PORT:-2382},etcd-3=http://${LOCAL_HOST}:${ETCD3_PEER_PORT:-2380}
      - --initial-cluster-token=${ETCD_CLUSTER_TOKEN:-warehouse-tier4-etcd}
      - --initial-cluster-state=new
    ports:
      - "${ETCD2_CLIENT_PORT:-2381}:${ETCD2_CLIENT_PORT:-2381}"
      - "${ETCD2_PEER_PORT:-2382}:${ETCD2_PEER_PORT:-2382}"
    volumes:
      - etcd2_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2381", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 30

  pg-1:
    <<: *patroni-service
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg-1
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: ${REMOTE_HOST}:${PG1_PORT:-5433}
      PATRONI_RESTAPI_CONNECT_ADDRESS: ${REMOTE_HOST}:${PATRONI1_REST_PORT:-8008}
    ports:
      - "${PG1_PORT:-5433}:5432"
      - "${PATRONI1_REST_PORT:-8008}:8008"
    volumes:
      - pg1_data:/var/lib/postgresql/patroni
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy

  pg-2:
    <<: *patroni-service
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg-2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: ${REMOTE_HOST}:${PG2_PORT:-5434}
      PATRONI_RESTAPI_CONNECT_ADDRESS: ${REMOTE_HOST}:${PATRONI2_REST_PORT:-8009}
    ports:
      - "${PG2_PORT:-5434}:5432"
      - "${PATRONI2_REST_PORT:-8009}:8008"
    volumes:
      - pg2_data:/var/lib/postgresql/patroni
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: tier_4/api/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_WRITE_HOSTS: "${REMOTE_HOST},${REMOTE_HOST},${LOCAL_HOST}"
      DB_READ_HOSTS: "${REMOTE_HOST},${REMOTE_HOST},${LOCAL_HOST}"
      DB_PORTS: "${PG1_PORT:-5433},${PG2_PORT:-5434},${PG3_PORT:-5432}"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-12}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-3}
      API_WORKERS: ${API_WORKERS:-2}
    command: ["sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS} --no-access-log"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  etcd1_data:
  etcd2_data:
  pg1_data:
  pg2_data:
