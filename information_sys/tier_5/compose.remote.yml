name: warehouse-tier5-remote

x-zookeeper-environment: &zookeeper-environment
  ZOO_SERVERS: "server.1=${REMOTE_HOST}:${ZK1_PEER_PORT:-2888}:${ZK1_ELECTION_PORT:-3888};${ZK1_CLIENT_PORT:-2181} server.2=${REMOTE_HOST}:${ZK2_PEER_PORT:-2889}:${ZK2_ELECTION_PORT:-3889};${ZK2_CLIENT_PORT:-2182} server.3=${LOCAL_HOST}:${ZK3_PEER_PORT:-2888}:${ZK3_ELECTION_PORT:-3888};${ZK3_CLIENT_PORT:-2181}"
  ZOO_4LW_COMMANDS_WHITELIST: ruok,srvr,mntr,conf
  ZOO_AUTOPURGE_PURGEINTERVAL: 1
  ZOO_AUTOPURGE_SNAPRETAINCOUNT: 3
  ZOO_CFG_EXTRA: quorumListenOnAllIPs=true

x-patroni-environment: &patroni-environment
  PATRONI_SCOPE: ${CLUSTER_NAME:-warehouse-tier5}
  PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/patroni
  PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
  PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
  PATRONI_ZOOKEEPER_HOSTS: "'${REMOTE_HOST}:${ZK1_CLIENT_PORT:-2181}','${REMOTE_HOST}:${ZK2_CLIENT_PORT:-2182}','${LOCAL_HOST}:${ZK3_CLIENT_PORT:-2181}'"
  PATRONI_SUPERUSER_USERNAME: ${POSTGRES_SUPERUSER:-postgres}
  PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
  PATRONI_REPLICATION_USERNAME: ${POSTGRES_REPLICATION_USER:-replicator}
  PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-warehouse}
  POSTGRES_USER: ${POSTGRES_USER:-warehouse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-patroni-service: &patroni-service
  build:
    context: ..
    dockerfile: tier_5/patroni/Dockerfile
  restart: unless-stopped
  environment: *patroni-environment
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  zk-1:
    image: zookeeper:3.9.5-jre-17
    restart: unless-stopped
    hostname: zk-1
    environment:
      <<: *zookeeper-environment
      ZOO_MY_ID: 1
    ports:
      - "${ZK1_CLIENT_PORT:-2181}:${ZK1_CLIENT_PORT:-2181}"
      - "${ZK1_PEER_PORT:-2888}:${ZK1_PEER_PORT:-2888}"
      - "${ZK1_ELECTION_PORT:-3888}:${ZK1_ELECTION_PORT:-3888}"
    volumes:
      - zk1_data:/data
      - zk1_log:/datalog
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 30

  zk-2:
    image: zookeeper:3.9.5-jre-17
    restart: unless-stopped
    hostname: zk-2
    environment:
      <<: *zookeeper-environment
      ZOO_MY_ID: 2
    ports:
      - "${ZK2_CLIENT_PORT:-2182}:${ZK2_CLIENT_PORT:-2182}"
      - "${ZK2_PEER_PORT:-2889}:${ZK2_PEER_PORT:-2889}"
      - "${ZK2_ELECTION_PORT:-3889}:${ZK2_ELECTION_PORT:-3889}"
    volumes:
      - zk2_data:/data
      - zk2_log:/datalog
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 30

  pg-1:
    <<: *patroni-service
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg-1
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: ${REMOTE_HOST}:${PG1_PORT:-5433}
      PATRONI_RESTAPI_CONNECT_ADDRESS: ${REMOTE_HOST}:${PATRONI1_REST_PORT:-8008}
    ports:
      - "${PG1_PORT:-5433}:5432"
      - "${PATRONI1_REST_PORT:-8008}:8008"
    volumes:
      - pg1_data:/var/lib/postgresql/patroni
    depends_on:
      zk-1:
        condition: service_healthy
      zk-2:
        condition: service_healthy

  pg-2:
    <<: *patroni-service
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg-2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: ${REMOTE_HOST}:${PG2_PORT:-5434}
      PATRONI_RESTAPI_CONNECT_ADDRESS: ${REMOTE_HOST}:${PATRONI2_REST_PORT:-8009}
    ports:
      - "${PG2_PORT:-5434}:5432"
      - "${PATRONI2_REST_PORT:-8009}:8008"
    volumes:
      - pg2_data:/var/lib/postgresql/patroni
    depends_on:
      zk-1:
        condition: service_healthy
      zk-2:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: tier_5/api/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_WRITE_HOSTS: "${REMOTE_HOST},${REMOTE_HOST},${LOCAL_HOST}"
      DB_READ_HOSTS: "${REMOTE_HOST},${REMOTE_HOST},${LOCAL_HOST}"
      DB_PORTS: "${PG1_PORT:-5433},${PG2_PORT:-5434},${PG3_PORT:-5432}"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-12}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-3}
      API_WORKERS: ${API_WORKERS:-2}
    command: ["sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS} --no-access-log"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  zk1_data:
  zk1_log:
  zk2_data:
  zk2_log:
  pg1_data:
  pg2_data:
