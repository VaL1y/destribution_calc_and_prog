name: warehouse-pg-tier1

services:
  pg-1:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse}
    command:
      - postgres
      - -c
      - max_connections=${DB_MAX_CONNECTIONS:-80}
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-128MB}
      - -c
      - wal_level=replica
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    ports:
      - "127.0.0.1:${PG_PORT:-15432}:5432"
    volumes:
      - pg_1_data:/var/lib/postgresql/data
    networks:
      warehouse-lab:
        aliases: [pg-1]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-1.0}"
          memory: "${DB_MEMORY_LIMIT:-512M}"

volumes:
  pg_1_data:

networks:
  warehouse-lab:
    external: true
    name: ${DB_NETWORK:-warehouse-lab}
